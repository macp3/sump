services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sump_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/sump.db
    volumes:
      - sump_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sump_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sump_data:
